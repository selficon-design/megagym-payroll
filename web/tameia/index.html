<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MEGA GYM · Ταμεία</title>
<meta name="description" content="Εσωτερική εφαρμογή MEGA GYM για το κλείσιμο ταμείου των καταστημάτων.">
<meta name="theme-color" content="#0b1f3d">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="MEGA Ταμεία">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icons/favicon-64.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="tameia.css">
<script>try{if(localStorage.getItem("mg-tameia-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
</head>
<body>
<div id="boot" class="boot"><img src="../mega-gym-logo.png" alt="MEGA GYM"><div class="spinner"></div></div>

<section id="login" class="login" hidden>
  <form id="login-form" class="login-card" autocomplete="on">
    <img class="login-logo" src="../mega-gym-logo.png" alt="MEGA GYM Fitness Clubs">
    <h1>Ταμεία</h1>
    <p class="muted">Ίδιος λογαριασμός με την εφαρμογή Μισθοδοσίας / HR.</p>
    <label for="login-email">Email</label>
    <input id="login-email" type="email" autocomplete="username" required>
    <label for="login-password">Κωδικός</label>
    <input id="login-password" type="password" autocomplete="current-password" required minlength="6">
    <button class="btn primary block" type="submit">Είσοδος</button>
    <p id="login-msg" class="form-msg" role="status"></p>
  </form>
</section>

<div id="app" class="app" hidden>
  <aside id="sidebar" class="sidebar">
    <div class="side-head">
      <div><img class="side-logo" src="../mega-gym-logo.png" alt="MEGA GYM Fitness Clubs"><span class="app-tag">Ταμεία</span></div>
      <button class="icon-btn only-mobile" id="close-menu" aria-label="Κλείσιμο μενού">✕</button>
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="side-foot"><div id="me-box" class="me-box"></div></div>
  </aside>
  <div id="scrim" class="scrim"></div>
  <div class="main-wrap">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="open-menu" aria-label="Μενού">☰</button>
      <div class="top-title"><strong id="page-title">Ταμεία</strong><span id="page-sub" class="muted"></span></div>
      <div class="top-actions"><button class="btn sm theme-btn" id="theme-btn" type="button" aria-pressed="false"></button></div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>

<dialog id="dlg" class="dlg"><div id="dlg-body"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="../config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
